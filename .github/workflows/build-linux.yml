name: Build Linux preview
on:
  workflow_dispatch:
    inputs:
      publish_linux:
        description: Publish Linux assets after verification
        type: boolean
        default: false
      release_tag:
        description: Existing release tag to upload Linux packages to
        type: string
        default: '1.9.7'
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg aria2 libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-keysyms1 libxcb-icccm4
      - run: bash packaging/build_release_linux.sh
      - run: QT_QPA_PLATFORM=offscreen .venv-linux/bin/python -m unittest discover -s tests -t . -q
      - run: .venv-linux/bin/python tests/ffmpeg_matrix.py /usr/bin/ffmpeg
      - run: PYTHONPATH=. .venv-linux/bin/python packaging/check_linux_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-x86_64-preview
          path: dist/*linux-*
      - name: Replace verified Linux release assets
        if: inputs.publish_linux
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/*linux-* --clobber
